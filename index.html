<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Rotation</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/10551/10551600.png">

    <style>
      :root {
        --bg: #ece0d1;
        --card: #ffffff;
        --primary: #967259;
        --primary-dark: #634832;
        --text: #222;
        --muted: #666;
        --border: #e5e7eb;
        --shadow: 0 12px 30px rgba(0, 0, 0,.08);
      }

      * {
        box-sizing: border-box;
        font-family: Inter,Segoe UI,Roboto,Arial,sans-serif;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 900px;
        padding: 20px 15px;
        margin: 0 auto;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 15px;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
      }

      h2 {
        margin-top: 0;
      }

      .card {
        background: var(--card);
        border-radius: 18px;
        padding: 18px;
        box-shadow: var(--shadow);
        margin-bottom: 24px;
      }

      .today h2 {
        margin: 0;
        color: var(--primary);
      }

      .meal-name {
        font-size: 1.8rem;
        margin: 14px 0 8px;
        font-weight: 700;
      }

      .description {
        color: var(--muted);
        line-height: 1.5;
      }

      .cookbook {
        color: var(--text);
        line-height: 1.5;
        font-size: 14px;
      }

      form {
        display: grid;
        gap: 12px;
      }

      input, textarea {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 18px;
      }

      textarea {
        resize: vertical;
        min-height: 90px;
      }

      button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 18px;
        transition:.2s;
      }

      button:hover {
        background: var(--primary-dark);
      }

      .meal {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 12px;
      }

      .meal-list-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .meal-actions {
        display: flex;
        gap: 4px;
      }

      .meal-actions button {
        padding: 6px 10px;
      }

      .move {
        background: none;
        color: #333;
        min-width: 38px;
      }

      .move:hover:not(:disabled) {
        background: #e5e7eb;
      }

      .move:disabled {
        opacity:.4;
        cursor: not-allowed;
      }

      .delete {
        color: #ef4444;
        background: none;
        font-size: 15px;
      }

      .delete:hover {
        background: #ffd9d9;
      }

      .small {
        color: var(--muted);
        font-size:.9rem;
      }

      .upcoming-item {
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }

      .upcoming-item:last-child {
        border-bottom: none;
      }

      .upcoming-item-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 5px;
      }

      .date {
        min-width: 95px;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 30px;
      }

      @media (max-width: 600px) {
        h2 {
          margin-bottom: 10px;
        }

        .container {
          padding: 15px 10px;
        }

        .card {
          padding: 12px;
        }

        .meal-name {
          font-size: 1.6rem;
          margin: 8px 0;
        }

        .move {
          min-width: 20px;
        }

        .meal-actions button {
          padding: 2px 6px;
        }

        .meal-list-item .description {
          margin-top: 6px !important;
          font-size: 14px;
        }

        .meal-list-item .cookbook {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <img src="https://static.thenounproject.com/png/food-on-plate-icon-5535956-512.png" alt="food on plate icon" width="50" height="50" fetchpriority="high">
        <h1>Meal Rotation</h1>
      </div>
      <div class="card today">
        <h2>Today's Meal</h2>
        <div id="todayContent"></div>
      </div>

      <div class="card">
        <h2 id="upcoming-title">Upcoming Meals</h2>
        <div id="upcoming"></div>
      </div>

      <div class="card">
        <h2>Add Meal</h2>
        <form id="mealForm">
          <input id="name-input" placeholder="Meal name" autocomplete="off" required>
          <textarea id="description-input" placeholder="Description or recipe notes"></textarea>
          <input id="cookbook-input" placeholder="Cookbook inspiration" autocomplete="off">
          <input id="category-input" placeholder="Category" autocomplete="off">
          <button>Add Meal</button>
        </form>
      </div>

      <div class="card">
        <h2>Meal List</h2>
        <div id="mealList"></div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap;">
        <button type="button" id="exportBtn">Export Meals</button>
        <button type="button" id="importBtn">Import Meals</button>
        <input
          type="file"
          id="importFile"
          accept=".json,application/json"
          style="display: none;"
        >
        <button type="button" id="shareBtn">Copy Share Link</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <script>
      let means;
      const STORAGE_KEY = "mealRotationMeals";
      const params = new URLSearchParams(window.location.search);
      if (params.has("data")) {
        try {
          const json = LZString.decompressFromEncodedURIComponent(params.get("data"));
          const imported = JSON.parse(json);
          if (Array.isArray(imported)) {
            meals = imported;
            localStorage.setItem(
              STORAGE_KEY,
              JSON.stringify(meals)
            );
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        meals = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(meals));
      }

      function dayOfYear(date) {
        const start = new Date(date.getFullYear(), 0, 0);
        const diff = date-start;
        return Math.floor(diff/86400000);
      }

      function todaysIndex() {
        if (meals.length === 0) return -1;
        return (dayOfYear(new Date())-1)%meals.length;
      }

      function getMonday() {
        const today = new Date();
        const monday = new Date(today);
        const day = today.getDay(); // Sunday = 0, Monday = 1
        const daysSinceMonday = (day + 6) % 7;
        monday.setDate(today.getDate() - daysSinceMonday);
        if (today.getDay() === 0) monday.setDate(monday.getDate() + 7);
        return monday;
      }

      function mondaysIndex() {
        if (meals.length === 0) return -1;
        const monday = getMonday();
        return (dayOfYear(monday) - 1) % meals.length;
      }

      function renderToday() {
        const el = document.getElementById("todayContent");
        if (meals.length === 0) {
          el.innerHTML = '<div class="empty">Add some meals to begin your rotation.</div>';
          return;
        }
        const meal = meals[todaysIndex()];
        el.innerHTML = `
          <div class="meal-name">${meal.name}</div>
          <div class="description">${meal.description||"No description."}</div>
          <div class="cookbook">${meal.cookbook ? `Cookbook inspo: ${meal.cookbook}` : ""}</div>
        `;
      }

      function renderMeals() {
        const list = document.getElementById("mealList");
        if (meals.length === 0) {
          list.innerHTML = '<div class="empty">No meals yet.</div>';
          return;
        }

        list.innerHTML = `
          <div class="small" style="margin-bottom: 18px;">
            Rotating through ${meals.length} meal${meals.length === 1 ? "" : "s"}.
          </div>
        `;

        meals.forEach((meal,index) => {
          const div = document.createElement("div");
          div.className = "meal";
          div.innerHTML = `
            <div class="meal-list-item">
              <div>
                <strong>${meal.name}</strong>
                <div class="description" style="margin-top: 8px;">${meal.description||""}</div>
                <div class="cookbook" style="margin-top: 4px; font-size: 14px">
                  ${meal.cookbook ? `Cookbook inspo: ${meal.cookbook}` : ""}
                </div>
              </div>
              
              <div class="meal-actions">
                <button class="move" ${index === 0 ? "disabled" : ""}>▲</button>
                <button class="move" ${index === meals.length - 1 ? "disabled" : ""}>▼</button>
                <button class="delete">🗑️</button>
              </div>
            </div>
          `;
          const buttons = div.querySelectorAll("button");
          buttons[0].onclick = () => moveMeal(index, index - 1);
          buttons[1].onclick = () => moveMeal(index, index + 1);
          buttons[2].onclick = () => {
              meals.splice(index, 1);
              save();
              render();
          };
          list.appendChild(div);
        });
      }

      function renderUpcomingMeals() {
        const container = document.getElementById("upcoming");
        if (meals.length === 0) {
          container.innerHTML = '<div class="empty">Nothing to rotate.</div>';
          return;
        }

        container.innerHTML = "";
        const mondayIndex = mondaysIndex();
        for(let i = 0; i < Math.min(meals.length, 7); i++) {
          const meal = meals[(mondayIndex+i) % meals.length];
          const date = getMonday();
          date.setDate(date.getDate() + i);
          const row = document.createElement("div");
          row.className = "upcoming-item";
          row.innerHTML = `
            <div class="upcoming-item-title">
              <div class="date">
                ${date.toLocaleDateString(undefined, {
                  weekday:'short',
                  month:'short',
                  day:'numeric'
                })}
              </div>
              <strong>${meal.name}</strong>
            </div>
            <div style="text-align: right;">
              <div class="description" style="font-size: 14px;">${meal.description||""}</div>
              <div class="cookbook" style="font-size: 12px;">
                ${meal.cookbook ? `Cookbook inspo: ${meal.cookbook}` : ""}
              </div>
            </div>
          `;
          container.appendChild(row);
        }
      }

      function render() {
        renderToday();
        renderMeals();
        renderUpcomingMeals();
      }

      document.getElementById("mealForm").addEventListener("submit", e => {
        e.preventDefault();
        meals.push({
          name: document.getElementById("name-input").value.trim(),
          description: document.getElementById("description-input").value.trim(),
          cookbook: document.getElementById("cookbook-input").value.trim(),
          category: document.getElementById("category-input").value.trim(),
        });
        save();
        e.target.reset();
        render();
      });

      function moveMeal(from, to) {
        if (to < 0 || to >= meals.length) {
            return;
        }
        const [meal] = meals.splice(from, 1);
        meals.splice(to, 0, meal);
        save();
        render();
      }

      render();

      const exportBtn = document.getElementById("exportBtn");
      const importBtn = document.getElementById("importBtn");
      const importFile = document.getElementById("importFile");

      exportBtn.addEventListener("click", () => {
        const data = JSON.stringify(meals, null, 2);
        const blob = new Blob([data], {
          type: "application/json"
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        const today = new Date().toISOString().split("T")[0];
        a.download = `meal-rotation-${today}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      importBtn.addEventListener("click", () => {
        importFile.click();
      });

      importFile.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = JSON.parse(reader.result);
            if (!Array.isArray(imported)) {
              throw new Error("Not an array");
            }
            if (
              imported.some(
                m =>
                  typeof m.name !== "string" ||
                  typeof m.description !== "string" ||
                  typeof m.cookbook !== "string" ||
                  typeof m.category !== "string"
              )
            ) {
              throw new Error("Invalid meal format");
            }
            if (!confirm(
              `Import ${imported.length} meals?\n\nThis will replace your current meal list.`
            )) {
              return;
            }
            meals = imported;
            save();
            render();
            alert("Meals imported successfully!");
          } catch {
            alert("That doesn't appear to be a valid meal export.");
          }
        };

        reader.readAsText(file);
        importFile.value = "";
      });

      document.getElementById("shareBtn").addEventListener("click", async () => {
        const compressed = LZString.compressToEncodedURIComponent(
          JSON.stringify(meals)
        );
        const url =
          window.location.origin +
          window.location.pathname +
          "?data=" +
          compressed;
        await navigator.clipboard.writeText(url);
        alert("Share link copied!");
      });
    </script>
  </body>
</html>
